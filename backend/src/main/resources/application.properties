# ── Server ──────────────────────────────────────────────────
server.port=8081

# ── Database (H2 in-memory — dev only) ──────────────────────
spring.datasource.url=jdbc:h2:mem:golddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# ── JPA ─────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:goldapp-super-secret-key-must-be-at-least-32-chars!!}
jwt.expiration=86400000

# ── Rate limiting ────────────────────────────────────────────
rate.limit.login.max=5
rate.limit.login.window-seconds=60

# ── Metals-API (جهانی) هر ثانیه ─────────────────────────────
metals.api.key=YOUR_METALS_API_KEY
metals.api.url=https://metals-api.com/api/latest?base=USD&symbols=XAU

# ── FRED API (Fed rate / CPI) ────────────────────────────────
fred.api.key=YOUR_FRED_API_KEY
fred.api.url=https://api.stlouisfed.org/fred/series/observations

# ── Yahoo Finance ────────────────────────────────────────────
yahoo.finance.url=https://query1.finance.yahoo.com/v8/finance/chart

# ── TGJU scraping (ایران) هر ۳۰ ثانیه ──────────────────────
tgju.url=https://www.tgju.org/profile/geram18
tgju.interval.ms=30000

# ── Email (Gmail SMTP) ───────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Binance WebSocket ────────────────────────────────────────
binance.ws.url=wss://stream.binance.com:9443/ws/paxgusdt@trade

# ── Telegram Bot ─────────────────────────────────────────────
telegram.bot.token=YOUR_TELEGRAM_BOT_TOKEN

# ── Health check ─────────────────────────────────────────────
health.check.interval.ms=60000

# ── ML Service ───────────────────────────────────────────────
ml.service.url=http://localhost:8000

# ── Cache ───────────────────────────────────────────────────
spring.cache.type=simple

# ── CORS ────────────────────────────────────────────────────
# Web (Vite dev ports), Mobile Expo, Android emulator (10.0.2.2)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://10.0.2.2:8081,http://10.0.2.2:19000,exp://localhost:19000,exp://localhost:8081,exp://127.0.0.1:19000
